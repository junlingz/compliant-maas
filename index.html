<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超大规模智算引擎 · MaaS 管理平台</title>
  <style>
    :root {
      --primary: #1767f2;
      --primary-strong: #0f55da;
      --primary-soft: #eaf3ff;
      --cyan: #16a6c7;
      --green: #16a36a;
      --amber: #d98a08;
      --red: #db3b45;
      --ink: #17253d;
      --text: #3a475b;
      --muted: #7d8a9f;
      --line: #e4eaf3;
      --surface: #ffffff;
      --surface-soft: #f6f9fd;
      --sidebar: 244px;
      --radius: 8px;
      --shadow: 0 10px 30px rgba(33, 70, 122, .08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        linear-gradient(140deg, rgba(222, 237, 255, .92), rgba(247, 250, 255, .9) 46%, rgba(228, 241, 255, .88));
      font-size: 14px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    .app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; transition: .22s ease; }
    .app.collapsed { --sidebar: 72px; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: hidden;
      padding: 20px 14px; border-right: 1px solid rgba(255,255,255,.65);
      background: rgba(234, 243, 255, .72); backdrop-filter: blur(20px);
      z-index: 20;
    }
    .brand { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 8px 16px; color: #1d3558; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
      background: #fff; color: var(--primary); border: 2px solid currentColor;
      box-shadow: inset 0 0 0 4px #dbe9ff; flex: none;
    }
    .brand-title { font-size: 16px; line-height: 1.35; font-weight: 750; white-space: nowrap; }
    .nav-label { color: #9aa6b7; font-size: 11px; padding: 16px 12px 7px; white-space: nowrap; }
    .nav { display: grid; gap: 5px; }
    .nav-item {
      width: 100%; border: 0; background: transparent; color: #516078;
      display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
      border-radius: 8px; text-align: left; white-space: nowrap; transition: .16s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,.62); color: var(--ink); }
    .nav-item.active {
      color: var(--primary); background: rgba(255,255,255,.88); font-weight: 650;
      box-shadow: 0 7px 18px rgba(46, 92, 153, .08);
    }
    .nav-item .ico { width: 20px; height: 20px; flex: none; }
    .nav-item .nav-text { overflow: hidden; text-overflow: ellipsis; }
    .nav-item .count { margin-left: auto; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #e6edf7; }
    .sidebar-foot { position: absolute; bottom: 18px; left: 14px; right: 14px; }
    .help-card { background: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.9); padding: 12px; border-radius: 8px; white-space: nowrap; }
    .help-card b { display: block; color: var(--ink); margin-bottom: 4px; }
    .help-card span { color: var(--muted); font-size: 12px; }
    .app.collapsed .brand-title, .app.collapsed .nav-label, .app.collapsed .nav-text,
    .app.collapsed .nav-item .count, .app.collapsed .help-card { display: none; }
    .app.collapsed .sidebar { padding-inline: 10px; }
    .app.collapsed .brand { justify-content: center; padding-inline: 0; }
    .app.collapsed .nav-item { justify-content: center; padding: 0; }

    .workspace { min-width: 0; padding: 0 24px 28px; }
    .topbar {
      height: 76px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0;
      z-index: 15; background: linear-gradient(180deg, rgba(236,245,255,.96), rgba(236,245,255,.76), transparent);
    }
    .icon-btn {
      width: 36px; height: 36px; border: 1px solid transparent; border-radius: 7px;
      background: transparent; color: #53627a; display: grid; place-items: center;
    }
    .icon-btn:hover { background: rgba(255,255,255,.8); border-color: #dfe8f4; }
    .top-search {
      margin-left: 8px; width: min(430px, 42vw); height: 38px; border: 1px solid rgba(215,226,241,.9);
      background: rgba(255,255,255,.72); border-radius: 7px; display: flex; align-items: center; padding: 0 11px; color: #9aa6b7;
    }
    .top-search input { flex: 1; border: 0; outline: 0; background: transparent; padding: 0 9px; min-width: 0; color: var(--ink); }
    .kbd { border: 1px solid #dbe3ee; background: #fff; border-radius: 5px; padding: 2px 6px; font-size: 11px; color: #8894a7; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .status-pill { display: flex; align-items: center; gap: 7px; color: #58667b; padding: 7px 10px; border: 1px solid #dfe7f2; background: rgba(255,255,255,.68); border-radius: 20px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(22,163,106,.12); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(145deg, #2577f5, #52b7dc); color: #fff; display: grid; place-items: center; font-weight: 700; border: 2px solid #fff; }
    .page { background: rgba(250,252,255,.74); border: 1px solid rgba(255,255,255,.92); border-radius: 12px; box-shadow: var(--shadow); min-height: calc(100vh - 104px); overflow: hidden; }
    .page-head {
      min-height: 84px; display: flex; align-items: center; gap: 14px; padding: 20px 26px;
      border-bottom: 1px solid rgba(225,233,244,.95); background: rgba(255,255,255,.55);
    }
    .page-title { min-width: 0; }
    .breadcrumb { color: #8b97a8; font-size: 12px; margin-bottom: 7px; }
    .page-title h1 { margin: 0; color: var(--ink); font-size: 22px; line-height: 1.2; }
    .page-title p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .content { padding: 22px 26px 30px; }
    .btn {
      height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid #dbe3ee;
      background: #fff; color: #435169; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: .15s ease; white-space: nowrap;
    }
    .btn:hover { border-color: #adc6eb; color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 5px 13px rgba(23,103,242,.18); }
    .btn.primary:hover { background: var(--primary-strong); }
    .btn.danger { color: var(--red); }
    .btn.small { height: 30px; padding: 0 10px; font-size: 12px; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: var(--radius); }
    .card-pad { padding: 18px; }
    .section { margin-top: 20px; }
    .section:first-child { margin-top: 0; }
    .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; color: var(--ink); font-size: 16px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .section-head .right { margin-left: auto; }
    .stat { padding: 17px 18px; position: relative; overflow: hidden; }
    .stat::after { content: ""; position: absolute; width: 76px; height: 76px; border-radius: 50%; background: var(--tint, #edf4ff); right: -28px; top: -28px; }
    .stat-label { color: var(--muted); margin-bottom: 10px; }
    .stat-value { color: var(--ink); font-size: 27px; font-weight: 750; letter-spacing: -.5px; }
    .stat-meta { margin-top: 8px; font-size: 12px; color: var(--green); }
    .stat-meta.warn { color: var(--amber); }
    .module-card { padding: 18px; display: flex; flex-direction: column; min-height: 180px; transition: .18s ease; cursor: pointer; }
    .module-card:hover { border-color: #bad1f5; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(39,83,145,.08); }
    .module-top { display: flex; align-items: center; gap: 11px; }
    .module-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; background: var(--primary-soft); color: var(--primary); }
    .module-card h3 { margin: 0; color: var(--ink); font-size: 15px; }
    .module-card p { color: var(--muted); line-height: 1.65; margin: 13px 0 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .chip, .badge { padding: 4px 8px; border-radius: 5px; font-size: 11px; background: #f0f4f9; color: #5d6c82; }
    .badge { display: inline-flex; align-items: center; gap: 5px; }
    .badge.green { background: #e7f8f0; color: #11855a; }
    .badge.blue { background: #eaf3ff; color: #1767f2; }
    .badge.amber { background: #fff5df; color: #a96800; }
    .badge.red { background: #ffedef; color: #c8313c; }
    .workflow { padding: 20px; display: grid; grid-template-columns: repeat(6, minmax(95px,1fr)); gap: 6px; overflow-x: auto; }
    .flow-step { position: relative; text-align: center; min-width: 95px; }
    .flow-step:not(:last-child)::after { content: ""; height: 1px; background: #bfd3ef; position: absolute; top: 17px; left: 65%; right: -35%; }
    .flow-dot { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 9px; background: #fff; border: 1px solid #bfd3ef; color: var(--primary); display: grid; place-items: center; font-weight: 700; position: relative; z-index: 1; }
    .flow-step.done .flow-dot { background: var(--primary); color: #fff; border-color: var(--primary); }
    .flow-step b { display: block; color: var(--ink); font-size: 12px; }
    .flow-step span { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 13px; }
    .field { height: 36px; border: 1px solid #dce4ef; border-radius: 7px; padding: 0 11px; background: #fff; color: var(--ink); outline: none; }
    .field:focus, textarea.field:focus { border-color: #8eb7f4; box-shadow: 0 0 0 3px rgba(23,103,242,.08); }
    textarea.field { height: auto; padding: 10px 11px; resize: vertical; }
    .search-field { min-width: 230px; flex: 1; max-width: 390px; }
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th { background: #f7f9fc; color: #66748a; font-weight: 650; text-align: left; height: 42px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
    td { height: 52px; padding: 8px 14px; border-bottom: 1px solid #edf1f6; color: #435169; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdff; }
    .table-title { color: var(--ink); font-weight: 600; }
    .table-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .actions { display: flex; gap: 4px; }
    .link { border: 0; background: transparent; color: var(--primary); padding: 3px 5px; }
    .link.red { color: var(--red); }
    .progress { width: 112px; height: 6px; background: #edf1f6; border-radius: 4px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: var(--value); background: var(--primary); border-radius: inherit; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
    .form-row label { color: #526177; font-size: 12px; display: block; margin-bottom: 7px; }
    .form-row .field { width: 100%; }
    .form-row.full { grid-column: 1 / -1; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 18px; overflow-x: auto; }
    .tab { height: 42px; border: 0; background: transparent; padding: 0 15px; color: #718096; white-space: nowrap; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--primary); border-color: var(--primary); font-weight: 650; }
    .summary-list { display: grid; gap: 12px; }
    .summary-row { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 11px; border-bottom: 1px solid #edf1f6; }
    .summary-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .summary-row span { color: var(--muted); }
    .summary-row b { color: var(--ink); text-align: right; font-weight: 650; }
    .model-grid { grid-template-columns: repeat(auto-fit, minmax(235px,1fr)); }
    .model-card { padding: 16px; }
    .model-card-head { display: flex; align-items: flex-start; gap: 10px; }
    .model-logo { width: 38px; height: 38px; border-radius: 8px; background: #eff5ff; color: var(--primary); display: grid; place-items: center; font-weight: 800; flex: none; }
    .model-card h3 { margin: 0 0 4px; color: var(--ink); font-size: 14px; }
    .model-card p { color: var(--muted); font-size: 12px; line-height: 1.55; min-height: 56px; }
    .model-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .model-foot { display: flex; gap: 6px; margin-top: 14px; padding-top: 13px; border-top: 1px solid #edf1f6; }
    .chart { height: 210px; position: relative; padding: 14px 12px 26px 38px; overflow: hidden; }
    .chart-grid { position: absolute; inset: 14px 12px 26px 38px; background: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #edf1f6 40px); border-left: 1px solid #edf1f6; border-bottom: 1px solid #edf1f6; }
    .chart svg { width: 100%; height: 100%; overflow: visible; position: relative; z-index: 1; }
    .metric-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; margin: 12px 0; }
    .metric-bar { height: 8px; border-radius: 4px; background: #edf1f6; overflow: hidden; }
    .metric-bar i { display: block; height: 100%; width: var(--value); background: var(--color, var(--primary)); border-radius: inherit; }
    .topology { min-height: 260px; padding: 20px; position: relative; background: linear-gradient(#f8fbff, #fff); overflow: hidden; }
    .topology-grid { position: absolute; inset: 0; opacity: .45; background-image: linear-gradient(#e8eff8 1px, transparent 1px), linear-gradient(90deg,#e8eff8 1px,transparent 1px); background-size: 24px 24px; }
    .topology-map { position: relative; z-index: 1; height: 220px; }
    .node { position: absolute; width: 96px; padding: 9px; border: 1px solid #cfe0f6; border-radius: 7px; background: #fff; box-shadow: 0 5px 12px rgba(50,90,145,.07); text-align: center; }
    .node b { color: var(--ink); display: block; font-size: 12px; }
    .node span { color: var(--green); font-size: 11px; }
    .node.primary-node { left: 42%; top: 8px; border-color: #8cb7f2; }
    .node.n1 { left: 8%; top: 125px; }.node.n2 { left: 31%; top: 125px; }.node.n3 { left: 56%; top: 125px; }.node.n4 { right: 7%; top: 125px; }
    .connector { position: absolute; height: 1px; background: #aac6ea; transform-origin: left; z-index: 0; }
    .coverage { display: grid; gap: 8px; }
    .coverage-group { border: 1px solid var(--line); border-radius: 7px; background: #fff; overflow: hidden; }
    .coverage-head { min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .coverage-head strong { color: var(--ink); }
    .coverage-head .badge { margin-left: auto; }
    .coverage-body { display: none; padding: 4px 14px 14px 48px; }
    .coverage-group.open .coverage-body { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px 14px; }
    .coverage-item { color: #65738a; font-size: 12px; padding: 6px 0; display: flex; gap: 7px; }
    .check { color: var(--green); font-weight: 800; }
    .empty { text-align: center; padding: 46px 20px; color: var(--muted); }
    .modal-mask, .drawer-mask {
      position: fixed; inset: 0; z-index: 60; background: rgba(20,32,52,.26); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: .18s ease;
    }
    .modal-mask.show, .drawer-mask.show { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(590px, calc(100vw - 32px)); max-height: calc(100vh - 60px); overflow: auto;
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -47%); background: #fff;
      border-radius: 10px; box-shadow: 0 24px 70px rgba(24,48,84,.24); transition: .18s ease;
    }
    .modal-mask.show .modal { transform: translate(-50%, -50%); }
    .modal-head, .drawer-head { display: flex; align-items: center; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h3, .drawer-head h3 { margin: 0; color: var(--ink); font-size: 16px; }
    .modal-head .icon-btn, .drawer-head .icon-btn { margin-left: auto; }
    .modal-body { padding: 20px; }
    .modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    .drawer {
      position: absolute; right: 0; top: 0; bottom: 0; width: min(460px, 92vw); background: #fff;
      transform: translateX(100%); transition: .22s ease; box-shadow: -18px 0 50px rgba(24,48,84,.14); overflow: auto;
    }
    .drawer-mask.show .drawer { transform: translateX(0); }
    .drawer-body { padding: 20px; }
    .log {
      margin-top: 12px; padding: 14px; background: #142033; color: #c9d7ea; border-radius: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.75; min-height: 180px; white-space: pre-wrap;
    }
    .toast-stack { position: fixed; right: 22px; top: 86px; z-index: 100; display: grid; gap: 8px; }
    .toast { min-width: 260px; padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #dfe7f2; box-shadow: 0 12px 34px rgba(28,57,99,.16); display: flex; gap: 9px; align-items: center; animation: toastIn .22s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-7px); } }
    .command { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 28px)); background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 70px rgba(24,48,84,.25); }
    .command input { width: 100%; height: 54px; border: 0; border-bottom: 1px solid var(--line); padding: 0 18px; outline: 0; color: var(--ink); font-size: 15px; }
    .command-list { padding: 8px; }
    .command-item { padding: 10px 12px; border-radius: 7px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .command-item:hover { background: var(--surface-soft); }
    .command-item small { color: var(--muted); margin-left: auto; }
    .mobile-nav { display: none; }
    @media (max-width: 1100px) {
      .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .split { grid-template-columns: 1fr; }
      .coverage-group.open .coverage-body { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); width: 260px; transition: .2s ease; }
      .app.mobile-open .sidebar { transform: translateX(0); box-shadow: 18px 0 60px rgba(24,48,84,.17); }
      .workspace { padding: 0 10px 16px; }
      .topbar { height: 64px; }
      .mobile-nav { display: grid; }
      #sidebarToggle { display: none; }
      .top-search { width: 42px; padding: 0; justify-content: center; margin-left: 0; background: transparent; border-color: transparent; }
      .top-search input, .top-search .kbd { display: none; }
      .status-pill { display: none; }
      .page { min-height: calc(100vh - 78px); }
      .page-head { padding: 16px; align-items: flex-start; }
      .page-title h1 { font-size: 19px; }
      .page-title p { display: none; }
      .content { padding: 16px; }
      .grid.cols-4, .grid.cols-3, .grid.cols-2, .form-grid { grid-template-columns: 1fr; }
      .head-actions .btn:not(.primary) { display: none; }
      .coverage-group.open .coverage-body { grid-template-columns: 1fr; padding-left: 18px; }
      .workflow { justify-content: start; }
    }
  </style>
</head>

        network:`<div class="form-grid"><div class="form-row"><label>架构类型</label><select class="field"><option>Transformer Decoder-only</option><option>Encoder-Decoder</option><option>Mixture of Experts</option></select></div><div class="form-row"><label>隐藏层数量</label><input class="field" type="number" value="32"></div><div class="form-row"><label>隐藏层维度</label><input class="field" type="number" value="4096"></div><div class="form-row"><label>注意力头数</label><input class="field" type="number" value="32"></div><div class="form-row"><label>最大序列长度</label><select class="field"><option>8192</option><option>32768</option><option>131072</option></select></div><div class="form-row"><label>MoE 专家数量</label><input class="field" type="number" value="8"></div></div>`,
        hyper:`<div class="form-grid"><div class="form-row"><label>优化器</label><select class="field"><option>AdamW</option><option>Adafactor</option><option>Lion</option></select></div><div class="form-row"><label>基础学习率</label><input class="field" value="2e-5"></div><div class="form-row"><label>学习率调度</label><select class="field"><option>Cosine decay</option><option>Linear warmup</option><option>Polynomial decay</option></select></div><div class="form-row"><label>权重衰减</label><input class="field" value="0.1"></div><div class="form-row"><label>梯度裁剪</label><input class="field" value="1.0"></div><div class="form-row"><label>混合精度</label><select class="field"><option>BF16</option><option>FP16</option><option>FP32</option></select></div></div>`,
        evaluation:`<div class="form-grid"><div class="form-row"><label>评估频率</label><select class="field"><option>每 500 steps</option><option>每个 Epoch</option><option>仅训练结束</option></select></div><div class="form-row"><label>验证数据集</label><select class="field"><option>科技情报验证集 v2</option><option>综合能力测试集</option></select></div><div class="form-row full"><label>评估指标</label><div class="chips"><label class="chip"><input type="checkbox" checked> 困惑度</label><label class="chip"><input type="checkbox" checked> 生成流畅度</label><label class="chip"><input type="checkbox" checked> 逻辑一致性</label><label class="chip"><input type="checkbox"> 安全性</label><label class="chip"><input type="checkbox"> 领域准确率</label></div></div></div>`,
        resource:`<div class="form-grid"><div class="form-row"><label>计算资源池</label><select class="field"><option>智算集群 A · H800</option><option>智算集群 B · A800</option></select></div><div class="form-row"><label>GPU 数量</label><select class="field"><option>8 卡</option><option>16 卡</option><option>32 卡</option><option>64 卡</option></select></div><div class="form-row"><label>并行策略</label><select class="field"><option>自动推荐</option><option>数据并行 + 张量并行</option><option>流水线并行 + ZeRO</option></select></div><div class="form-row"><label>Gang Scheduling</label><select class="field"><option>启用</option><option>停用</option></select></div><div class="form-row"><label>Checkpoint 间隔</label><input class="field" value="1000 steps"></div><div class="form-row"><label>最大保留数量</label><input class="field" type="number" value="5"></div></div>`

      const filters = ['全部','运行中','排队中','已完成','异常'];

    function modelDetail(name) {
      const m=models.find(x=>x.name===name);
      openDrawer(`${m.name} · ${m.version}`, `<div style="display:flex;gap:10px;margin-bottom:18px"><div class="model-logo">${m.name[0]}</div><div><b style="color:var(--ink)">${m.type} · ${m.size}</b><div style="margin-top:5px">${badge(m.state)}</div></div></div><p style="line-height:1.7;color:var(--muted)">${m.desc}</p><div class="section-head" style="margin-top:22px"><h2>模型元信息</h2></div><div class="summary-list"><div class="summary-row"><span>模型架构</span><b>Transformer / ${m.type}</b></div><div class="summary-row"><span>上下文长度</span><b>32,768 tokens</b></div><div class="summary-row"><span>权重格式</span><b>SafeTensors</b></div><div class="summary-row"><span>适配状态</span><b>已优化支持</b></div><div class="summary-row"><span>最近更新</span><b>2026-07-28</b></div></div><button class="btn primary" style="width:100%;margin-top:20px" data-page="training" onclick="closeDrawer();state.page='training';render()">用于新训练任务</button>`);
    }
    function bindDynamic() {
      $$('[data-page]').forEach(el=>el.onclick=()=>{state.page=el.dataset.page;$('#app').classList.remove('mobile-open');render();});
      $$('[data-training-tab]').forEach(el=>el.onclick=()=>{state.trainingTab=el.dataset.trainingTab;render();});
      $$('[data-algo-tab]').forEach(el=>el.onclick=()=>{state.algoTab=el.dataset.algoTab;render();});
      $$('[data-task-filter]').forEach(el=>el.onclick=()=>{state.taskFilter=el.dataset.taskFilter;render();});
      $$('[data-task]').forEach(el=>el.onclick=()=>taskDetail(el.dataset.task));
      $$('[data-model]').forEach(el=>el.onclick=()=>modelDetail(el.dataset.model));
      $$('.coverage-head').forEach(el=>el.onclick=()=>el.parentElement.classList.toggle('open'));
      const ms=$('#modelSearch');
      if(ms) ms.oninput=()=>{$('#modelGrid').innerHTML=modelCards(models.filter(m=>(m.name+m.type+m.desc).toLowerCase().includes(ms.value.toLowerCase())));bindDynamic();};
      const mt=$('#modelType');
      if(mt) mt.onchange=()=>{$('#modelGrid').innerHTML=modelCards(mt.value==='全部模型类型'?models:models.filter(m=>m.type===mt.value));bindDynamic();};
      const rt=$('#reverseText');
      if(rt) rt.oninput=()=>$('#charCount').textContent=`${rt.value.length} 字`;
      $$('[data-action]').forEach(el=>el.onclick=()=>handleAction(el.dataset.action,el));
    }
    function handleAction(action, el) {
      const simple = {
        notify:'当前无未读异常告警',
        saveDraft:'训练配置草稿已保存',
        exportReport:'测评报告已生成，正在准备下载',
        saveAlgo:'算法实验已保存至个人配置库',
        exportOutline:'原型功能大纲已生成',
        alertConfig:'告警配置已载入',
        resourceStrategy:'已生成拓扑感知的并行策略建议',
        optimizePrompt:'提示模板已优化，综合评分提升至 91.3',
        testPrompt:'测试任务已提交，预计 8 秒返回结果',
        pause:`已向任务“${el.dataset.name||''}”发送暂停指令`,
        useModel:`已选择 ${el.dataset.name||'该模型'}，正在打开训练配置`
      };
      if(simple[action]) { toast(simple[action]); if(action==='useModel'){setTimeout(()=>{state.page='training';render()},450)} return; }
      if(action==='createTask' || action==='createModel' || action==='importModel') {
        openModal(action==='importModel'?'导入模型':action==='createModel'?'登记模型':'新建任务', `<div class="form-grid"><div class="form-row full"><label>名称</label><input class="field" placeholder="请输入名称"></div><div class="form-row"><label>类型</label><select class="field"><option>模型训练</option><option>模型测评</option><option>部署发布</option></select></div><div class="form-row"><label>所属项目</label><select class="field"><option>科技情报大模型</option><option>教育大模型</option></select></div><div class="form-row full"><label>说明</label><textarea class="field" rows="3" placeholder="补充任务目标与备注"></textarea></div></div>`, '创建', ()=>toast('已创建草稿，可继续补充配置'));
      } else if(action==='submitTraining') {
        openModal('确认提交训练任务', `<div style="padding:10px;background:#f5f9ff;border-radius:7px;line-height:1.8"><b style="color:var(--ink)">科技情报领域监督微调</b><br>基础模型：Qwen2.5-7B<br>计算资源：8 × H800<br>预计时长：18 小时<br>并行策略：DP 4 × TP 2</div><p style="color:var(--muted)">参数合法性与资源配额校验已通过，提交后将进入训练队列。</p>`, '确认提交', ()=>{toast('训练任务已成功提交');setTimeout(()=>{state.page='tasks';render()},500)});
      } else if(action==='createService') {
        openModal('发布推理服务', `<div class="form-grid"><div class="form-row full"><label>服务名称</label><input class="field" value="Qwen-Science-Chat"></div><div class="form-row"><label>模型版本</label><select class="field"><option>Qwen2.5-7B / v2.5.3</option></select></div><div class="form-row"><label>部署策略</label><select class="field"><option>灰度发布</option><option>全量发布</option></select></div><div class="form-row"><label>初始实例数</label><input class="field" type="number" value="2"></div><div class="form-row"><label>推理精度</label><select class="field"><option>BF16</option><option>INT8</option></select></div></div>`, '确认发布', ()=>toast('推理服务发布任务已创建'));
      } else if(action==='loadExample') {
        const text='本研究提出了一种面向多源科技文献的知识图谱构建方法，通过跨模态特征对齐与图神经网络实现实体消歧，在公开数据集上取得了 92.4% 的 F1 分数。';
        $('#reverseText').value=text; $('#charCount').textContent=`${text.length} 字`;
      } else if(action==='clearReverse') {
        $('#reverseText').value=''; $('#charCount').textContent='0 字';
      } else if(action==='analyzeReverse') {
        if(!$('#reverseText').value.trim()){toast('请先输入或加载待分析文本','warn');return;}
        const result=$('#reverseResult'); result.innerHTML='<div class="empty">正在使用 Qwen 系列专用适配策略分析…</div>';
        setTimeout(()=>result.innerHTML=`<div class="section-head"><h2>推断结果</h2><span class="badge green right">置信度 87%</span></div><div class="form-row"><label>重构提示词</label><textarea class="field" rows="5">请以学术摘要的风格，总结以下研究工作的核心方法、技术创新及实验结果，突出关键指标。</textarea></div><div style="margin-top:14px"><label class="table-sub">关键指令</label><div class="chips" style="margin-top:7px"><span class="chip">学术摘要</span><span class="chip">核心方法</span><span class="chip">实验指标</span></div></div><div style="margin-top:14px"><label class="table-sub">意图分类</label><div class="chips" style="margin-top:7px"><span class="badge blue">摘要生成</span><span class="badge">信息抽取</span></div></div>`,700);
      } else if(action==='serviceDetail') {
        openDrawer(el.dataset.name, `<div style="margin-bottom:18px">${badge('在线')}</div><div class="summary-list"><div class="summary-row"><span>服务版本</span><b>v2.5.3</b></div><div class="summary-row"><span>当前实例</span><b>4</b></div><div class="summary-row"><span>自动伸缩</span><b>2–12 实例</b></div><div class="summary-row"><span>P95 延迟</span><b>218 ms</b></div><div class="summary-row"><span>今日请求</span><b>2.84M</b></div></div>${lineChart()}`);
      } else {
        toast('该功能入口已保留，可在下一版补充详细流程');
      }
    }
    $('#sidebarToggle').onclick=()=>$('#app').classList.toggle('collapsed');
    $('#mobileNav').onclick=()=>$('#app').classList.toggle('mobile-open');
    $('#commandTrigger').onclick=commandPalette;
    $('#modalMask').addEventListener('click',e=>{if(e.target===$('#modalMask'))closeModal()});
    $('#drawerMask').addEventListener('click',e=>{if(e.target===$('#drawerMask'))closeDrawer()});
    document.addEventListener('keydown',e=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette();}
      if(e.key==='Escape'){closeModal();closeDrawer();}
    });
    render();
  </script>
</body>
</html>
